<!DOCTYPE html>
<html class="login-pf" lang="en">
<head>
<title>Sign in to abs</title>
</head>
<body id="keycloak-bg" class="" data-page-id="login-login-update-password">
<div class="pf-v5-c-login">
  <div class="pf-v5-c-login__container">
    <header id="kc-header" class="pf-v5-c-login__header">
      <div id="kc-header-wrapper"
              class="pf-v5-c-brand">abs</div>
    </header>
    <main class="pf-v5-c-login__main">
      <div class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl" id="kc-page-title">
        Update password
</h1>
      </div>
      <div class="pf-v5-c-login__main-body">
            <div class="pf-v5-c-alert pf-m-inline pf-v5-u-mb-md pf-m-warning">
                <div class="pf-v5-c-alert__icon">
                    <span class="fa fa-fw fa-exclamation-triangle"></span>
                </div>
                <span class="pf-v5-c-alert__title kc-feedback-text">You need to change your password to activate your account.</span>
            </div>
        <form id="kc-passwd-update-form" class="pf-v5-c-form pf-v5-u-w-100" onsubmit="login.disabled = true; return true;" action="http://idp.test/realms/abs/login-actions/required-action?session_code=FSXdvfPGOGM6b6pVBMUR8Q-oaOeOfhoXvW_6XmZ319g&amp;execution=UPDATE_PASSWORD&amp;client_id=abs&amp;tab_id=j5SvNb_oGUw&amp;client_data=eyJ0ZXN0Ijp0cnVlfQ" method="post" novalidate="novalidate">
<div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__group-label pf-v5-u-pb-xs">
        <label for="password-new" class="pf-v5-c-form__label">
        <span class="pf-v5-c-form__label-text">
            New Password
        </span>
        </label>
    </div>
    <div class="pf-v5-c-input-group">
      <div class="pf-v5-c-input-group__item pf-m-fill">
        <span class="pf-v5-c-form-control ">
          <input id="password-new" name="password-new" value="" type="password" autocomplete="new-password" autofocus
                  aria-invalid=""/>
        </span>
      </div>
      <div class="pf-v5-c-input-group__item">
        <button class="pf-v5-c-button pf-m-control" type="button" aria-label="Show password"
                aria-controls="password-new" data-password-toggle
                data-icon-show="fa-eye fas" data-icon-hide="fa-eye-slash fas"
                data-label-show="Show password" data-label-hide="Hide password" id="password-new-show-password">
            <i class="fa-eye fas" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="pf-v5-c-form__helper-text" aria-live="polite">
        <div class="pf-v5-c-helper-text pf-v5-u-display-flex pf-v5-u-justify-content-space-between">
        </div>
    </div>
    <div id="input-error-container-password-new">
    </div>
</div>
<div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__group-label pf-v5-u-pb-xs">
        <label for="password-confirm" class="pf-v5-c-form__label">
        <span class="pf-v5-c-form__label-text">
            Confirm password
        </span>
        </label>
    </div>
    <div class="pf-v5-c-input-group">
      <div class="pf-v5-c-input-group__item pf-m-fill">
        <span class="pf-v5-c-form-control ">
          <input id="password-confirm" name="password-confirm" value="" type="password" autocomplete="new-password"
                  aria-invalid=""/>
        </span>
      </div>
      <div class="pf-v5-c-input-group__item">
        <button class="pf-v5-c-button pf-m-control" type="button" aria-label="Show password"
                aria-controls="password-confirm" data-password-toggle
                data-icon-show="fa-eye fas" data-icon-hide="fa-eye-slash fas"
                data-label-show="Show password" data-label-hide="Hide password" id="password-confirm-show-password">
            <i class="fa-eye fas" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="pf-v5-c-form__helper-text" aria-live="polite">
        <div class="pf-v5-c-helper-text pf-v5-u-display-flex pf-v5-u-justify-content-space-between">
        </div>
    </div>
    <div id="input-error-container-password-confirm">
    </div>
</div>
            <div class="pf-v5-c-form__group">
    <div id="kc-form-options" class="">
        <div class="">
  <div class="pf-v5-c-check">
    <label for="logout-sessions" class="pf-v5-c-check">
      <input
        class="pf-v5-c-check__input"
        type="checkbox"
        id="logout-sessions"
        name="logout-sessions"
      />
      <span class="pf-v5-c-check__label">Sign out from other devices</span>
    </label>
  </div>
        </div>
    </div>
            </div>
  <div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__actions pf-v5-u-pt-xs pf-v5-u-flex-nowrap">
  <button class="pf-v5-c-button pf-m-primary pf-m-block" name="login" id="kc-submit"
          type="submit" >
  Submit
  </button>
    </div>
  </div>
        </form>
    <div class="pf-v5-c-login__main-footer">
          </div>
      </div>
        <div class="pf-v5-c-login__main-footer">
        </div>
    </main>
  </div>
</div>
</body>
</html>
