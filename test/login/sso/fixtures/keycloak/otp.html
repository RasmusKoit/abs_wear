<!DOCTYPE html>
<html class="login-pf" lang="en">
<head>
<title>Sign in to abs</title>
</head>
<body id="keycloak-bg" class="" data-page-id="login-login-otp">
<div class="pf-v5-c-login">
  <div class="pf-v5-c-login__container">
    <header id="kc-header" class="pf-v5-c-login__header">
      <div id="kc-header-wrapper"
              class="pf-v5-c-brand">abs</div>
    </header>
    <main class="pf-v5-c-login__main">
      <div class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl" id="kc-page-title">
        Sign In
</h1>
      </div>
      <div class="pf-v5-c-login__main-body">
                <div class="pf-v5-c-form pf-v5-u-w-100 pf-v5-u-mb-md-on-md">
<div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__group-label pf-v5-u-pb-xs">
        <label for="username" class="pf-v5-c-form__label">
        <span class="pf-v5-c-form__label-text">
                Username or email
        </span>
        </label>
    </div>
    <div class="pf-v5-c-input-group">
      <div class="pf-v5-c-input-group__item pf-m-fill">
        <span class="pf-v5-c-form-control pf-m-readonly">
          <input id="kc-attempted-username" value="wear-otp" readonly>
        </span>
      </div>
      <div class="pf-v5-c-input-group__item">
        <button id="reset-login" class="pf-v5-c-button pf-m-control kc-login-tooltip" type="button"
              aria-label="Restart login" onclick="location.href='/realms/abs/login-actions/restart?client_id=abs&amp;tab_id=tm02pN0d750&amp;client_data=eyJ0ZXN0Ijp0cnVlfQ&amp;skip_logout=false'">
            <i class="fa-sync-alt fas" aria-hidden="true"></i>
            <span class="kc-tooltip-text">Restart login</span>
        </button>
      </div>
    </div>
    <div id="input-error-container-username">
    </div>
</div>
                </div>
        <form id="kc-otp-login-form" class="pf-v5-c-form pf-v5-u-w-100" onsubmit="login.disabled = true; return true;" action="http://idp.test/realms/abs/login-actions/authenticate?session_code=TljwJID7tEltyh_oaBQ4uZQzZpDMUi8nJwG1MVGd2hk&amp;execution=5b69e2c9-fcf2-4257-8a10-7a7f34f363e7&amp;client_id=abs&amp;tab_id=tm02pN0d750&amp;client_data=eyJ0ZXN0Ijp0cnVlfQ" method="post">
            <input id="selectedCredentialId" type="hidden" name="selectedCredentialId" value="f8bb8afd-96af-48e1-97ce-336781f412b2">
<div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__group-label pf-v5-u-pb-xs">
        <label for="otp" class="pf-v5-c-form__label">
        <span class="pf-v5-c-form__label-text">
            One-time code
        </span>
        </label>
    </div>
    <span class="pf-v5-c-form-control ">
        <input id="otp" name="otp" value="" type="text" autocomplete="one-time-code" autofocus
                inputmode="numeric"
                aria-invalid=""/>
    </span>
    <div id="input-error-container-otp">
    </div>
</div>
  <div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__actions pf-v5-u-pt-xs pf-v5-u-flex-wrap">
  <button class="pf-v5-c-button pf-m-primary pf-m-block" name="login" id="kc-login"
          type="submit" >
  Sign In
  </button>
    </div>
  </div>
        </form>
        <div class="pf-v5-c-login__main-footer">
          </div>
      </div>
        <div class="pf-v5-c-login__main-footer">
        </div>
    </main>
  </div>
</div>
</body>
</html>
