# Throwaway Audiobookshelf server for ABS Wear development and E2E tests.
# Deployed to ~/code/abs-wear-test on the dev box (see README.md).
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    container_name: abs-wear-test
    restart: unless-stopped
    ports:
      - "13378:80"
    environment:
      - TZ=Europe/Tallinn
      # Every E2E test logs in; the default (40 logins / 10 min) trips 429s.
      - RATE_LIMIT_AUTH_MAX=10000
    volumes:
      - ./data/config:/config
      - ./data/metadata:/metadata
      - ./data/audiobooks:/audiobooks:ro
      - ./data/podcasts:/podcasts:ro
      # Screenshot library from generate_demo.sh (not used by E2E).
      - ./data/demo:/demo:ro
