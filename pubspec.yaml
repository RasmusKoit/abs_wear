name: abs_wear
description: AudioBookShelf on your watch!
version: 1.1.0+20
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  audio_session: ^0.2.4
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  volume_controller: ^3.7.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/static/ABSWear.png"
  

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The ABSWear*.png/svg files are sources (launcher icons, splash); the
    # app bundles only this small copy of the round logo.
    - assets/static/logo.png
