name: Build Flutter APK's and App bundle

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build Name'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build Number'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Inputs go through env, never straight into shell lines.
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Validate inputs
        run: |
          [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "build_name must be X.Y.Z"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must be an integer"; exit 1; }

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        # The runner context isn't available in job-level env, so the path
        # is exported here for the build steps (read by build.gradle).
        run: |
          path="$RUNNER_TEMP/android_keystore.jks"
          echo "$KEYSTORE" | base64 --decode > "$path"
          echo "ANDROID_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: >
          flutter build apk --split-per-abi --release
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          --target lib/main_production.dart --flavor production

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: >
          flutter build appbundle --release
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          --target lib/main_production.dart --flavor production

      - name: Remove keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: abs-wear-${{ inputs.build_name }}+${{ inputs.build_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/productionRelease/*.aab

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ inputs.build_name }}+${{ inputs.build_number }}
          commit: ${{ github.sha }}
          artifacts: "build/app/outputs/flutter-apk/*.apk,build/app/outputs/bundle/productionRelease/*.aab"
