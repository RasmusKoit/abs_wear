name: Build Flutter APK's and App bundle

on:
  workflow_dispatch:
    inputs:
      # Empty: the version in pubspec.yaml (e.g. 1.1.0+20). Play needs a
      # build number above the last upload.
      build_name:
        description: 'Build name (X.Y.Z); empty = from pubspec.yaml'
        required: false
        default: ''
      build_number:
        description: 'Build number; empty = from pubspec.yaml'
        required: false
        default: ''
      play_track:
        description: 'Google Play track to upload the bundle to'
        type: choice
        default: none
        options: [none, 'wear:internal', 'wear:production']
      play_status:
        description: 'Play release: draft (finish in Play Console) or completed (send for review)'
        type: choice
        default: draft
        options: [draft, completed]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    env:
      # Inputs go through env, never straight into shell lines.
      # Named apart from the resolved BUILD_NAME/BUILD_NUMBER (written to
      # GITHUB_ENV below), so neither can shadow the other.
      INPUT_BUILD_NAME: ${{ inputs.build_name }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Only master can go to Play
        if: inputs.play_track != 'none' && github.ref != 'refs/heads/master'
        run: |
          echo "::error::play_track must be none when building from $GITHUB_REF (only refs/heads/master can upload to Play)"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate the version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          BUILD_NAME=${INPUT_BUILD_NAME:-${version%%+*}}
          BUILD_NUMBER=${INPUT_BUILD_NUMBER:-${version#*+}}
          [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "build_name must be X.Y.Z"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must be an integer"; exit 1; }
          echo "Building $BUILD_NAME+$BUILD_NUMBER"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Check the release tag is free
        if: github.ref == 'refs/heads/master'
        run: |
          tag="v$BUILD_NAME+$BUILD_NUMBER"
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then echo "::error::Tag $tag already exists; bump the build number"; exit 1; fi
          [ "$rc" = 2 ] || { echo "::error::Could not check tag $tag (git ls-remote exit $rc)"; exit 1; }

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --test-randomize-ordering-seed random

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        # The runner context isn't available in job-level env, so the path
        # is exported here for the build steps (read by build.gradle).
        run: |
          path="$RUNNER_TEMP/android_keystore.jks"
          echo "$KEYSTORE" | base64 --decode > "$path"
          echo "ANDROID_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: >
          flutter build apk --split-per-abi --release
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          --target lib/main_production.dart --flavor production

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: >
          flutter build appbundle --release
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          --target lib/main_production.dart --flavor production

      - name: Remove keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abs-wear-${{ env.BUILD_NAME }}+${{ env.BUILD_NUMBER }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/productionRelease/*.aab

      - name: Upload to Google Play
        if: inputs.play_track != 'none'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.koit.abs_wear
          releaseFiles: build/app/outputs/bundle/productionRelease/*.aab
          mappingFile: build/app/outputs/mapping/productionRelease/mapping.txt
          releaseName: ${{ env.BUILD_NAME }} (${{ env.BUILD_NUMBER }})
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}

      - name: Create release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ env.BUILD_NAME }}+${{ env.BUILD_NUMBER }}
          commit: ${{ github.sha }}
          artifacts: "build/app/outputs/flutter-apk/*.apk,build/app/outputs/bundle/productionRelease/*.aab"
          generateReleaseNotes: true
