name: Build Flutter APK's and App bundle

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build Name'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build Number'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Inputs go through env, never straight into shell lines.
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android_keystore.jks
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build APKs
        run: >
          flutter build apk --split-per-abi --release
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          --target lib/main_production.dart --flavor production

      - name: Build app bundle
        run: >
          flutter build appbundle --release
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          --target lib/main_production.dart --flavor production

      - name: Remove keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abs-wear-${{ inputs.build_name }}+${{ inputs.build_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/productionRelease/*.aab

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ inputs.build_name }}+${{ inputs.build_number }}
          commit: ${{ github.sha }}
          artifacts: "build/app/outputs/flutter-apk/*.apk,build/app/outputs/bundle/productionRelease/*.aab"
