name: abs_wear

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --test-randomize-ordering-seed random

      # Catches Gradle/AGP/R8 and manifest breakage that analyze and unit
      # tests can't see. Debug-signed (no release key in PR builds).
      - name: Build release APK
        run: flutter build apk --release --flavor production -t lib/main_production.dart

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v2
    with:
      includes: |
        **/*.md
      modified_files_only: false
