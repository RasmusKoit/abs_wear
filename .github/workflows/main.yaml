name: abs_wear

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Check coverage
        run: |
          awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{p=100*h/f; printf "Line coverage: %.1f%%\n", p; exit (p < MIN)}' MIN="$MIN_COVERAGE" coverage/lcov.info
        env:
          MIN_COVERAGE: 65

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Catches Gradle/AGP/R8 and manifest breakage that analyze and unit
      # tests can't see. Debug-signed (no release key in PR builds).
      - name: Build release APK
        run: flutter build apk --release --flavor production -t lib/main_production.dart

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@33d441b1f92ff046f1945309a204d9ed039e6fc9 # v2.1.0
    with:
      includes: |
        **/*.md
      modified_files_only: false
