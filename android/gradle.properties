# Kotlin compiles inside the Gradle daemon (no separate Kotlin daemons for the app's
# Kotlin 2.4.0 and Gradle's embedded 2.2.21 used by Flutter's Gradle plugin), so the
# daemon heap covers both. Raise to -Xmx3g if builds hit OutOfMemoryError.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# AGP 9 compiles the app's Kotlin itself (built-in Kotlin, no kotlin-android
# plugin). Flutter's Gradle plugin still needs the old DSL types.
android.newDsl=false
android.builtInKotlin=true
