org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Compatibility flags from the Flutter template so older plugins keep building on AGP 9
android.newDsl=false
android.builtInKotlin=false
# Plugins live in the pub cache on C: while the project is on F:; Kotlin incremental
# caches cannot span drives on Windows, so disable incremental compilation.
kotlin.incremental=false
