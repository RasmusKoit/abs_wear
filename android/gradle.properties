org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Compatibility flags from the Flutter template so older plugins keep building on
# AGP 9. Flutter warns builtInKotlin=false will stop working; drop it once
# fluttertoast and wearable_rotary support built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false
