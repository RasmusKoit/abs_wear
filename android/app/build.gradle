plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "dev.koit.abs_wear"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "dev.koit.abs_wear"
        // Wear OS 3+ (API 30). OnePlus Watch 2 on Wear OS 5 is API 34;
        // targets Android 16 / Wear OS 6.
        minSdk = 30
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            release {
                storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                keyAlias = System.getenv("ANDROID_KEYSTORE_ALIAS")
                keyPassword = System.getenv("ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD")
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        } else {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    flavorDimensions "default"
    productFlavors { 
        production {
            dimension = "default"
            applicationIdSuffix = ""
            manifestPlaceholders = [appName: "ABS Wear"]
        }
        staging {
            dimension = "default"
            applicationIdSuffix = ".stg"
            manifestPlaceholders = [appName: "[STG] ABS Wear"]
        }
        development {
            dimension = "default"
            applicationIdSuffix = ".dev"
            manifestPlaceholders = [appName: "[DEV] ABS Wear"]
        }
    }

    buildTypes {
        release {
            // Sign with the release key when one is configured (CI env vars or
            // key.properties); otherwise fall back to debug signing so a fresh
            // clone can still build a release APK.
            def hasReleaseKey = System.getenv("ANDROID_KEYSTORE_PATH") || keystorePropertiesFile.exists()
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation 'androidx.wear:wear:1.4.0'
    // RemoteAuthClient: "Continue on phone" sign-in (RemoteAuth.kt)
    implementation 'androidx.wear:wear-phone-interactions:1.1.1'
}
